services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    environment:
      APP_ENV: prod
      MERCURE_URL: http://mercure
    volumes:
      - uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mercure:
        condition: service_started
  mercure:
    image: dunglas/mercure
    env_file:
      - .env.docker
    environment:
      SERVER_NAME: ':80'
    ports:
      - "9080:80"
  ssh-gateway:
    build: ./ssh-gateway
    env_file:
      - .env.docker
    environment:
      SSH_GATEWAY_PORT: 7681
      SSH_API_URL: http://app
    ports:
      - "7681:7681"
    depends_on:
      - app
  mysql:
    image: mysql:8
    env_file:
      - .env.docker
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  uploads:
