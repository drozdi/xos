doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        mapping_types:
            enum: string
        types:
            EnumLicense: Doctrine\DBAL\Types\StringType
            EnumKey: Doctrine\DBAL\Types\StringType
    orm:
        # FILE_NOT_EXISTS (2): на Windows AUTOGENERATE_ALWAYS даёт race rename → «Отказано в доступе (code: 5)»
        auto_generate_proxy_classes: 2
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/App/Entity'
                prefix: 'App\Entity'
                alias: App
            Main:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Main/Entity'
                prefix: 'Main\Entity'
                alias: Main
            Device:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Device/Entity'
                prefix: 'Device\Entity'
                alias: Device
            IBlock:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/IBlock/Entity'
                prefix: 'IBlock\Entity'
                alias: IBlock
            SchoolTask:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/SchoolTask/Entity'
                prefix: 'SchoolTask\Entity'
                alias: SchoolTask
            IncCom:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/IncCom/Entity'
                prefix: 'IncCom\Entity'
                alias: IncCom
            Explorer:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Explorer/Entity'
                prefix: 'Explorer\Entity'
                alias: Explorer
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
