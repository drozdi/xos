security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # XOS Desktop: вход по login
        login_user_provider:
            id: App\Security\UserProvider\LoginUserProvider
        # Standalone apps (IncCom, SchoolTask): вход по email
        email_user_provider:
            id: App\Security\UserProvider\EmailUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Основной вход XOS (login + password)
        login:
            pattern: ^/api/login$
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Вход standalone IncCom (email + password)
        app_login:
            pattern: ^/api/IncCom/auth/login$
            stateless: true
            provider: email_user_provider
            user_checker: app.security.inccom_login_user_checker
            json_login:
                check_path: /api/IncCom/auth/login
                username_path: username
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Вход standalone SchoolTask (email + password)
        schooltask_login:
            pattern: ^/api/schooltask/auth/login$
            stateless: true
            provider: email_user_provider
            user_checker: app.security.schooltask_login_user_checker
            json_login:
                check_path: /api/schooltask/auth/login
                username_path: username
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Вход standalone Calendar (email + password; модуль открыт для ROLE_USER)
        calendar_login:
            pattern: ^/api/calendar/auth/login$
            stateless: true
            provider: email_user_provider
            user_checker: app.security.calendar_login_user_checker
            json_login:
                check_path: /api/calendar/auth/login
                username_path: username
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        refresh:
            pattern: ^/api/token/refresh
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            refresh_jwt:
                check_path: /api/token/refresh

        app_refresh:
            pattern: ^/api/IncCom/token/refresh
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            refresh_jwt:
                check_path: /api/IncCom/token/refresh

        schooltask_refresh:
            pattern: ^/api/schooltask/token/refresh
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            refresh_jwt:
                check_path: /api/schooltask/token/refresh

        calendar_refresh:
            pattern: ^/api/calendar/token/refresh
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            refresh_jwt:
                check_path: /api/calendar/token/refresh

        api:
            pattern: ^/api
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~
            logout:
                path: /api/logout

        uploads:
            pattern: ^/uploads
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/IncCom/auth/login$, roles: PUBLIC_ACCESS, methods: [POST, GET] }
        - { path: ^/api/IncCom/auth/register$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/IncCom/auth/logout$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/schooltask/auth/login$, roles: PUBLIC_ACCESS, methods: [POST, GET] }
        - { path: ^/api/schooltask/auth/logout$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/calendar/auth/login$, roles: PUBLIC_ACCESS, methods: [POST, GET] }
        - { path: ^/api/calendar/auth/logout$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/token/refresh$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/IncCom/token/refresh$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/schooltask/token/refresh$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/calendar/token/refresh$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/health, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/uploads/, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
