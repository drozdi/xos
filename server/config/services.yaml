# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    upload_dir: '%kernel.project_dir%/var/uploads'
    explorer_img_dir: '%kernel.project_dir%/var/img'
    explorer_home_dir: '%kernel.project_dir%/var/explorer/home'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/App/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Main\:
        resource: '../src/Main/'
        exclude:
            - '../src/Main/Entity/'

    IBlock\:
        resource: '../src/IBlock/'
        exclude:
            - '../src/IBlock/Entity/'

    Device\Controller\:
        resource: '../src/Device/Controller/'
        tags: ['controller.service_arguments']

    Device\Repository\:
        resource: '../src/Device/Repository/'

    Device\Service\DevicePropertyValueSerializer: ~

    Device\Service\DeviceManager:
        lazy: true
        calls:
            - setContainer: ['@service_container']
    Device\Service\LicenseManager:
        lazy: true
        calls:
            - setContainer: ['@service_container']
    Device\Service\SoftwareManager:
        lazy: true
        calls:
            - setContainer: ['@service_container']

    SchoolTask\Controller\:
        resource: '../src/SchoolTask/Controller/'
        tags: ['controller.service_arguments']

    SchoolTask\Repository\:
        resource: '../src/SchoolTask/Repository/'

    SchoolTask\Service\SchoolTaskManager:
        lazy: true
        calls:
            - setContainer: ['@service_container']
    SchoolTask\Service\EventManager:
        lazy: true
        calls:
            - setContainer: ['@service_container']

    IncCom\:
        resource: '../src/IncCom/'
        exclude:
            - '../src/IncCom/Entity/'

    IncCom\Service\IncComManager:
        public: true
        lazy: true
        calls:
            - setContainer: ['@service_container']

    Explorer\Controller\:
        resource: '../src/Explorer/Controller/'
        tags: ['controller.service_arguments']

    Explorer\Repository\:
        resource: '../src/Explorer/Repository/'

    Explorer\Service\:
        resource: '../src/Explorer/Service/'
        exclude:
            - '../src/Explorer/Service/FileTypeRegistry.php'
            - '../src/Explorer/Service/DiskRegistry.php'

    Explorer\Service\FileTypeRegistry:
        arguments:
            $configPath: '%kernel.project_dir%/src/Explorer/config/file-types.json'

    Explorer\Service\DiskRegistry:
        arguments:
            $uploadDir: '%upload_dir%'
            $imgDir: '%explorer_img_dir%'
            $homeBaseDir: '%explorer_home_dir%'

    Main\Controller\FileServeController:
        arguments:
            $uploadDir: '%upload_dir%'

    Main\Service\MainManager:
        public: true
        lazy: true
        calls:
            - setContainer: ['@service_container']
    Main\Service\ClaimantManager:
        public: true
        lazy: true
        calls:
            - setContainer: ['@service_container']
    Main\Service\FileManager:
        public: true
        lazy: true
        arguments:
            $uploadDir: '%upload_dir%'
        calls:
            - setContainer: ['@service_container']

    Gesdinet\JWTRefreshTokenBundle\EventListener\LogoutEventListener:
        tags: []
