security:
    firewalls:
        calendar_login:
            pattern: ^/api/calendar/auth/login$
            stateless: true
            provider: email_user_provider
            user_checker: app.security.calendar_login_user_checker
            json_login:
                check_path: /api/calendar/auth/login
                username_path: username
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        calendar_refresh:
            pattern: ^/api/calendar/token/refresh
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            refresh_jwt:
                check_path: /api/calendar/token/refresh

    access_control:
        - { path: ^/api/calendar/auth/login$, roles: PUBLIC_ACCESS, methods: [POST, GET] }
        - { path: ^/api/calendar/auth/logout$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/calendar/token/refresh$, roles: PUBLIC_ACCESS, methods: [POST] }
